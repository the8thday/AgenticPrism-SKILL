[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-prism"
version = "0.15.4"
description = "Auditable statistical analyses for antibody and biologics R&D, driven by modular Agent Skills"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy>=1.15", "pandas", "matplotlib", "statsmodels>=0.15,<0.16"]

[project.scripts]
agentic-prism = "agentic_prism.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
agentic_prism = ["r_scripts/*.R", "r_scripts/*.csv", "r_scripts_pk/*.R", "r_scripts_pk/*.csv", "r_scripts_pop/*.R", "r_scripts_pop/*.csv"]
